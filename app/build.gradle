plugins { id 'com.android.application' }

def stableKeystore = file('stable-signing.jks')
def stableStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def stableKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def stableKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasStableSigning = stableKeystore.exists() &&
        stableStorePassword &&
        stableKeyAlias &&
        stableKeyPassword

android {
    namespace 'ch.finanztracker.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ch.finanztracker.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile stableKeystore
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (hasStableSigning) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (hasStableSigning) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Die alten JDK-7/8-Aufteilungsartefakte enthalten Klassen, die bereits
// in kotlin-stdlib liegen. Ausschliessen verhindert doppelte Klassen.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
