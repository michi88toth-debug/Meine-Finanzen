name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/stable-signing.jks
      - name: Show Android signing fingerprints
        run: gradle :app:signingReport
      - name: Verify release signing key
        run: |
          if [ ! -f app/stable-signing.jks ]; then
            echo "Stable signing key is missing. Release APK must not be built unsigned."
            exit 1
          fi
      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: meine-finanzen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: finanztracker-release-apk
          path: app/build/outputs/apk/release/app-release.apk
