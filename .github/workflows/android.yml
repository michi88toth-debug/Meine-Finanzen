name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Show Android signing fingerprints
        run: gradle :app:signingReport
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Read Android debug certificate SHA-1
        run: keytool -list -v -keystore "$HOME/.config/.android/debug.keystore" -storepass android -alias AndroidDebugKey | grep -E "SHA1:|SHA-1:"
      - uses: actions/upload-artifact@v4
        with:
          name: meine-finanzen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
